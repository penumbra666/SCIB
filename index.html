<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AAVA-SCIB Program</title>
<style>
:root{
  --bg:#f5fafa;--card:#fff;--text:#111827;--muted:#828282;--border:#e5e7eb;
  --green:#009673;--yellow:#ffc30f;--pink:#f50f7d;--violet:#6464d7;--gray:#b4b4b4;
  --shadow:0 14px 38px rgba(0,0,0,.09);--radius:20px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
header{background:#000;color:#fff;padding:20px 36px 18px;position:relative;min-height:96px}
.brand-title{padding-top:8px}
.logo{height:72px;max-width:260px;object-fit:contain;position:absolute;right:36px;top:12px}
h1{margin:0;font-size:28px;letter-spacing:-.04em}
header p{margin:4px 0 0;color:#f5fafa;opacity:.85;font-size:13px}
.app{max-width:1600px;margin:auto;padding:16px 24px}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
button{border:0;border-radius:14px;padding:12px 18px;font:inherit;font-weight:850;cursor:pointer;background:#e5e7eb;color:#111827}
button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(245,15,125,.15)}
.primary,.tab.active{background:linear-gradient(135deg,var(--pink),var(--violet))!important;color:#fff!important}
.green{background:var(--green)!important;color:#fff!important}.yellow{background:var(--yellow)!important;color:#000!important}.danger{background:#fff0f6!important;color:var(--pink)!important}
.ops-grid{display:grid;grid-template-columns:160px 120px 110px 110px;gap:8px;align-items:center;justify-content:start}
.ops-grid button{height:38px;white-space:nowrap;padding:8px 12px;border-radius:11px;font-size:13px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;margin:12px 0 14px;border-bottom:1px solid var(--border)}
.tab{flex:0 0 auto;background:#fff;border:1px solid var(--border);white-space:nowrap}
.global-tab{background:#fff!important;color:#111827!important;border:1px solid var(--border)!important}
.global-tab.active{background:linear-gradient(135deg,var(--pink),var(--violet))!important;color:#fff!important;border:0!important}
.actions,.mode-switch,.workstream-actions{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.wide{grid-column:span 2}.full{grid-column:1/-1}
label{font-size:13px;color:var(--muted);font-weight:850}input,select,textarea{width:100%;border:1px solid var(--border);border-radius:14px;padding:12px 14px;font:inherit;background:#fff}textarea{min-height:90px}
.hint{color:var(--muted);font-size:15px}.ok{color:var(--green);font-weight:900}.bad{color:var(--pink);font-weight:900}
.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid var(--border);padding:12px;text-align:left;vertical-align:top;font-size:14px}th{background:#fafafa}
.badge{display:inline-flex;padding:6px 10px;border-radius:999px;font-weight:850;font-size:12px;white-space:nowrap}.type-pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;background:#eef2ff;color:#3730a3}.type-pill.milestone{background:#111827;color:#fff}
.milestone-row td{background:#f7f7fb;font-weight:900}.child-cell{padding-left:34px!important}.global-workstream-row td{background:#000!important;color:#fff!important;font-weight:900}
.empty{text-align:center;color:var(--muted);padding:24px}.hidden{display:none!important}
.filter-grid{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}.filter-box{border:1px solid var(--border);border-radius:16px;padding:14px;background:#fff}.filter-title{text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--muted);font-weight:900;margin-bottom:10px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:8px 11px;background:#fafafa;font-size:13px;font-weight:800}.chip input{width:auto;margin:0;accent-color:var(--pink)}.chip.selected{background:linear-gradient(135deg,rgba(245,15,125,.18),rgba(100,100,215,.22));border-color:var(--pink)}
.multi-select{min-height:130px}.small{font-size:12px;color:var(--muted)}
.gantt{overflow-x:auto}.gantt-grid{min-width:980px}.gantt-header,.gantt-row{display:grid;grid-template-columns:330px 1fr;align-items:center}.timeline{display:grid;border-left:1px solid var(--border)}.tick{border-right:1px solid var(--border);padding:6px 4px;text-align:center;font-size:12px;color:var(--muted)}.gantt-row{min-height:58px;border-top:1px solid var(--border)}.gantt-label{padding:8px;font-size:13px}.bar-area{position:relative;height:40px;border-left:1px solid var(--border);background-image:linear-gradient(to right,rgba(229,231,235,.8) 1px,transparent 1px)}.bar{position:absolute;top:8px;height:25px;border-radius:999px;padding:4px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:800;font-size:12px;background:#b4b4b4;color:#111827}.bar.milestone{height:30px;top:5px;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;border-radius:8px;box-shadow:0 8px 20px rgba(245,15,125,.25)}
.section-title-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.maximize-btn{width:42px;height:42px;padding:0;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--border);border-radius:12px;background:linear-gradient(135deg,var(--pink),var(--violet));color:#fff;font-size:22px}.maximize-btn::before{content:"⊠"}.maximized-card .maximize-btn::before{content:"×"}.maximized-card{position:fixed!important;top:50%!important;left:50%!important;transform:translate(-50%,-50%)!important;width:min(96vw,1500px)!important;height:min(92vh,900px)!important;z-index:200!important;overflow:auto!important;margin:0!important;box-shadow:0 28px 90px rgba(0,0,0,.48)!important}.maximize-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(3px);z-index:190;display:none}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:18px;z-index:99}.modal{background:#fff;border-radius:20px;box-shadow:var(--shadow);padding:24px;width:min(760px,100%);max-height:90vh;overflow:auto}.list{display:flex;flex-direction:column;gap:10px}.row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);border-radius:14px;padding:12px;gap:10px}.status-color{width:52px!important;height:38px!important;padding:3px!important}.status-hex{width:95px!important;padding:7px!important;font-size:12px}
.ops-card{padding:10px 12px}.ops-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.data-status{margin-left:auto;padding:8px 12px;border:1px solid var(--border);border-radius:12px;background:#fafafa;font-size:12px;font-weight:850;white-space:nowrap}.title-actions{display:flex;align-items:center;gap:10px}.edit-backlog-btn{background:linear-gradient(135deg,var(--pink),var(--violet))!important;color:#fff!important;padding:8px 14px;border-radius:12px;font-size:13px}.milestone-row td{border-left:4px solid var(--pink)}
@media(max-width:1000px){.grid,.filter-grid{grid-template-columns:1fr}.wide,.full{grid-column:auto}.ops-grid{grid-template-columns:1fr 1fr}.logo{height:56px;right:20px}header,.app{padding:16px 20px}h1{font-size:24px}}
@media(max-width:520px){.ops-grid{grid-template-columns:1fr}}
</style>
</head>

<script>
const STORAGE_KEY="aava_scib_program_blob_v6";
const DEFAULT_STATUSES=["Not started","On going","On hold","Completed"];
const STATUS_PALETTE=["#f8c8dc","#d8d5fb","#c9f4e7","#fff0b8","#ffd9bd","#d7c8f2","#bfe8dc","#e1defe"];

const blobConfig={
  enabled:true,
  containerSasUrl:"https://scib.blob.core.windows.net/scib?sp=racwdli&st=2026-05-07T20:14:04Z&se=2026-05-08T04:29:04Z&spr=https&sv=2025-11-05&sr=c&sig=qbIH9qAuV%2FRB1RXlg%2FX40i3YDM4uH6ND3rHly9ZN%2FQs%3D",
  blobName:"aava-scib-data.json"
};

let data=loadCache();
let activeId="global";
let globalMode="presentation";
let editingItemId=null;
let blobReady=false;
let blobStatus="Loading data...";
let saveTimer=null;
let globalFilters={workstreams:[],owners:[],statuses:[]};

function uid(p="id"){return p+"_"+Date.now()+"_"+Math.random().toString(16).slice(2)}
function todayISO(){return new Date().toISOString().slice(0,10)}
function addDays(dateStr,days){const d=new Date(dateStr+"T00:00:00");d.setDate(d.getDate()+Number(days));return d.toISOString().slice(0,10)}
function daysBetween(a,b){return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000)}
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function randomColor(){return STATUS_PALETTE[Math.floor(Math.random()*STATUS_PALETTE.length)]}
function defaultData(){return{owners:["Germán","Product","Tech Lead"],statuses:[...DEFAULT_STATUSES],statusColors:{},workstreams:[{id:"workstream_aipo",name:"AIPO",mode:"presentation",items:[]},{id:"workstream_tom",name:"TOM",mode:"presentation",items:[]}]}}
function normalize(d){
  if(!d)d=defaultData();
  if(!Array.isArray(d.owners))d.owners=[];
  if(!Array.isArray(d.statuses))d.statuses=[...DEFAULT_STATUSES];
  if(!d.statusColors)d.statusColors={};
  if(!Array.isArray(d.workstreams))d.workstreams=[];
  d.statuses.forEach(s=>{if(!d.statusColors[s])d.statusColors[s]=randomColor()});
  d.workstreams.forEach(w=>{
    if(!w.mode)w.mode="presentation";
    if(!Array.isArray(w.items))w.items=Array.isArray(w.tasks)?w.tasks.map(t=>({...t,type:"task"})):[];
    delete w.tasks;
    w.items.forEach((it,i)=>{
      if(!it.id)it.id=uid(it.type==="milestone"?"milestone":"task");
      if(!it.type)it.type="task";
      if(!it.number)it.number=i+1;
      if(!it.createdAt)it.createdAt=todayISO();
      it.duration=Number(it.duration||0);
      it.endDate=addDays(it.createdAt,it.duration);
      if(!it.status)it.status=d.statuses[0]||"Not started";
      if(!d.statuses.includes(it.status)){d.statuses.push(it.status);d.statusColors[it.status]=randomColor()}
      if(it.owner&&!d.owners.includes(it.owner))d.owners.push(it.owner);
      if(!Array.isArray(it.dependencies))it.dependencies=[];
      it.dependencies=it.dependencies.filter(depId=>d.workstreams.some(ww=>(ww.items||[]).some(x=>x.id===depId&&x.type==="milestone")));
      if(it.type==="milestone")it.parentId="";
      if(it.type==="task")it.parentId=it.parentId||"";
    });
    w.items.filter(x=>x.type==="task").forEach(t=>assignTaskToMilestoneFromDependency(w,t));
    w.items.filter(x=>x.type==="milestone").forEach(m=>recalcMilestone(w,m.id));
  });
  return d;
}
function loadCache(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw)return normalize(JSON.parse(raw))}catch(e){}return normalize(defaultData())}
function saveCache(){localStorage.setItem(STORAGE_KEY,JSON.stringify(data,null,2))}
function getWorkstream(){return data.workstreams.find(w=>w.id===activeId)}
function getItems(w){return w&&Array.isArray(w.items)?w.items:[]}
function getMilestones(w){return getItems(w).filter(x=>x.type==="milestone")}
function getTasks(w){return getItems(w).filter(x=>x.type==="task")}
function nextNum(w){return getItems(w).length?Math.max(...getItems(w).map(x=>Number(x.number)||0))+1:1}

function blobUrl(){
  const clean=blobConfig.containerSasUrl.trim();
  const q=clean.indexOf("?");
  const base=(q>=0?clean.slice(0,q):clean).replace(/\/$/,"");
  const query=q>=0?clean.slice(q+1):"";
  return base+"/"+encodeURIComponent(blobConfig.blobName)+"?"+query;
}
function blobReadUrl(){return blobUrl()+"&cacheBust="+Date.now()}
async function loadFromBlob(){
  try{
    const res=await fetch(blobReadUrl(),{method:"GET",headers:{"Accept":"application/json"}});
    if(res.status===404){blobReady=true;blobStatus="No data file yet. Click Save to create it.";render();return}
    if(!res.ok)throw new Error(await res.text());
    data=normalize(await res.json());
    saveCache();
    activeId="global";globalMode="presentation";editingItemId=null;
    blobReady=true;blobStatus="Data loaded · "+new Date().toLocaleTimeString();
    render();
  }catch(e){console.error(e);blobStatus="Data load failed. Check SAS, CORS and file name.";renderBlobPanel()}
}
async function saveToBlob(){
  try{
    normalize(data);
    const res=await fetch(blobUrl(),{method:"PUT",headers:{"x-ms-blob-type":"BlockBlob","Content-Type":"application/json"},body:JSON.stringify(data,null,2)});
    if(!res.ok)throw new Error(await res.text());
    blobReady=true;blobStatus="Data saved · "+new Date().toLocaleTimeString();
    renderBlobPanel();
  }catch(e){console.error(e);blobStatus="Data save failed. Local cache is still saved.";renderBlobPanel()}
}
function persist(){saveCache();clearTimeout(saveTimer);saveTimer=setTimeout(saveToBlob,800)}
function renderBlobPanel(){
  const el=document.getElementById("dataStatus");if(!el)return;
  el.className="data-status "+(blobReady?"ok":"bad");
  el.textContent=blobStatus;
}

function render(){saveCache();renderBlobPanel();renderTabs();renderPanel()}
function renderTabs(){
  const tabs=document.getElementById("tabs");tabs.innerHTML="";
  const g=document.createElement("button");g.className="tab global-tab "+(activeId==="global"?"active":"");g.textContent="Global";g.onclick=()=>{activeId="global";globalMode="presentation";editingItemId=null;render()};tabs.appendChild(g);
  data.workstreams.forEach(w=>{const b=document.createElement("button");b.className="tab "+(w.id===activeId?"active":"");b.textContent=w.name;b.onclick=()=>{activeId=w.id;w.mode="presentation";editingItemId=null;render()};tabs.appendChild(b)});
}
function renderPanel(){document.getElementById("panel").innerHTML=activeId==="global"?renderGlobal():renderWorkstream();if(activeId!=="global")populateForm()}

function renderEdit(w){return renderForm(w)+'<section id="backlogSection" class="card"><div class="section-title-row"><div class="title-actions"><h3>Backlog</h3><button class="edit-backlog-btn" onclick="setMode(\'presentation\')">Close edit</button></div><button class="maximize-btn" onclick="toggleMaximize(\'backlogSection\')" title="Expand"></button></div>'+renderBacklog(w,true)+'</section><section id="ganttSection" class="card"><div class="section-title-row"><h3>Gantt</h3><button class="maximize-btn" onclick="toggleMaximize(\'ganttSection\')" title="Expand"></button></div>'+renderGantt(w)+'</section>'}
function renderPresentation(w){return '<section id="backlogSection" class="card"><div class="section-title-row"><div class="title-actions"><h3>Backlog</h3><button class="edit-backlog-btn" onclick="setMode(\'edit\')">Edit</button></div><button class="maximize-btn" onclick="toggleMaximize(\'backlogSection\')" title="Expand"></button></div>'+renderBacklog(w,false)+'</section><section id="ganttSection" class="card"><div class="section-title-row"><h3>Gantt</h3><button class="maximize-btn" onclick="toggleMaximize(\'ganttSection\')" title="Expand"></button></div>'+renderGantt(w)+'</section>'}

function populateForm(){const a=document.getElementById("itemCreatedAt"),d=document.getElementById("itemDuration"),e=document.getElementById("itemEndDate");if(!a||!d||!e)return;const upd=()=>{e.value=a.value?addDays(a.value,Number(d.value||0)):""};a.oninput=upd;d.oninput=upd;upd();toggleParentField()}
function toggleParentField(){const type=document.getElementById("itemType")?.value;const field=document.getElementById("parentField");if(field)field.style.display=type==="milestone"?"none":"flex"}

function saveItem(ev){
  ev.preventDefault();
  const w=getWorkstream();
  const type=document.getElementById("itemType").value;
  const id=editingItemId||uid(type);
  const item={
    id,type,
    number:editingItemId?getItems(w).find(x=>x.id===editingItemId).number:nextNum(w),
    name:document.getElementById("itemName").value.trim(),
    description:document.getElementById("itemDescription").value.trim(),
    createdAt:document.getElementById("itemCreatedAt").value,
    duration:Number(document.getElementById("itemDuration").value),
    status:document.getElementById("itemStatus").value,
    owner:document.getElementById("itemOwner").value,
    parentId:type==="task"?document.getElementById("itemParentId").value:"",
    dependencies:Array.from(document.getElementById("itemDependencies").selectedOptions).map(o=>o.value).filter(id=>getItems(w).find(x=>x.id===id&&x.type==="milestone"))
  };
  item.endDate=addDays(item.createdAt,item.duration);
  if(!item.name)return alert("Name is required.");
  if(item.duration<0||Number.isNaN(item.duration))return alert("Duration must be valid.");
  if(type==="task"&&!item.parentId){
    const depMilestone=item.dependencies.map(id=>getItems(w).find(x=>x.id===id)).find(x=>x&&x.type==="milestone");
    if(depMilestone)item.parentId=depMilestone.id;
  }
  if(type==="task"&&!item.parentId)return alert("Every task must be assigned to a parent milestone or depend on a milestone.");
  if(hasCycle(w,item))return alert("Circular dependencies are not allowed.");
  if(editingItemId)w.items[w.items.findIndex(x=>x.id===editingItemId)]=item;else w.items.push(item);
  getTasks(w).forEach(t=>assignTaskToMilestoneFromDependency(w,t));
  getMilestones(w).forEach(m=>recalcMilestone(w,m.id));
  editingItemId=null;persist();render();
}
function hasCycle(w,candidate){const map=new Map(getItems(w).map(t=>[t.id,t]));map.set(candidate.id,candidate);function visit(id,path=new Set()){if(path.has(id))return true;const t=map.get(id);if(!t)return false;path.add(id);return (t.dependencies||[]).some(dep=>visit(dep,new Set(path)))}return visit(candidate.id)}
function getParentMilestoneId(w,item){if(!item||item.type!=="task")return "";if(item.parentId)return item.parentId;const dep=(item.dependencies||[]).map(id=>getItems(w).find(x=>x.id===id)).find(x=>x&&x.type==="milestone");return dep?dep.id:""}
function assignTaskToMilestoneFromDependency(w,item){if(!item||item.type!=="task")return;const parent=getParentMilestoneId(w,item);if(parent)item.parentId=parent}
function recalcMilestone(w,id){const m=getItems(w).find(x=>x.id===id&&x.type==="milestone");if(!m)return;const children=getTasks(w).filter(t=>getParentMilestoneId(w,t)===id);if(!children.length)return;m.createdAt=children.reduce((min,t)=>t.createdAt<min?t.createdAt:min,children[0].createdAt);m.endDate=children.reduce((max,t)=>t.endDate>max?t.endDate:max,children[0].endDate);m.duration=Math.max(daysBetween(m.createdAt,m.endDate),0)}
function editItem(id){editingItemId=id;getWorkstream().mode="edit";render();scrollTo({top:0,behavior:"smooth"})}
function deleteItem(id){const w=getWorkstream();const it=getItems(w).find(x=>x.id===id);if(!it)return;if(!confirm('Delete '+it.type+' "'+it.name+'"?'))return;if(it.type==="milestone"){const children=getTasks(w).filter(t=>getParentMilestoneId(w,t)===id);if(children.length){alert("This milestone has "+children.length+" child tasks. Move or delete them first.");return}}w.items=w.items.filter(x=>x.id!==id);w.items.forEach(x=>x.dependencies=(x.dependencies||[]).filter(d=>d!==id));persist();render()}
function orderedItems(w){const milestones=getMilestones(w).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));const tasks=getTasks(w);tasks.forEach(t=>assignTaskToMilestoneFromDependency(w,t));const result=[];milestones.forEach(m=>{result.push(m);tasks.filter(t=>getParentMilestoneId(w,t)===m.id).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)).forEach(t=>result.push(t))});const orphans=tasks.filter(t=>!getParentMilestoneId(w,t));if(orphans.length){result.push({id:"orphan_group",type:"milestone",number:"-",name:"Unassigned tasks",description:"Tasks without milestone",createdAt:todayISO(),duration:0,endDate:todayISO(),status:data.statuses[0]||"Not started",owner:"",dependencies:[],isVirtual:true});orphans.forEach(t=>result.push(t))}return result}

function renderBacklog(w,editable){const items=orderedItems(w);if(!items.length)return '<div class="empty">No milestones or tasks to display.</div>';return '<div class="table-wrap"><table><thead><tr><th>ID</th><th>Type</th><th>Name</th><th>Description</th><th>Start</th><th>Duration</th><th>End</th><th>Status</th><th>Owner</th><th>Dependencies</th>'+(editable?'<th>Actions</th>':"")+'</tr></thead><tbody>'+items.map(it=>rowHtml(w,it,editable)).join("")+'</tbody></table></div>'}
function rowHtml(w,it,editable){const parent=getItems(w).find(x=>x.id===getParentMilestoneId(w,it));return '<tr class="'+(it.type==="milestone"?"milestone-row":"")+'"><td>#'+it.number+'</td><td><span class="type-pill '+(it.type==="milestone"?"milestone":"")+'">'+it.type+'</span></td><td class="'+(it.type==="task"&&parent?"child-cell":"")+'"><strong>'+(it.type==="task"&&parent?"↳ ":"")+esc(it.name)+'</strong></td><td>'+esc(it.description)+'</td><td>'+it.createdAt+'</td><td>'+it.duration+' days</td><td>'+it.endDate+'</td><td><span class="badge" style="background:'+(data.statusColors[it.status]||"#e5e7eb")+';color:#111827">'+esc(it.status)+'</span></td><td>'+esc(it.owner)+'</td><td>'+deps(w,it)+'</td>'+(editable?'<td>'+(it.isVirtual?'-':'<div class="actions"><button onclick="editItem(\''+it.id+'\')">Edit</button><button class="danger" onclick="deleteItem(\''+it.id+'\')">Delete</button></div>')+'</td>':"")+'</tr>'}

function renderGantt(w){const items=orderedItems(w);if(!items.length)return '<div class="empty">No items available to generate the Gantt.</div>';const min=items.reduce((m,t)=>t.createdAt<m?t.createdAt:m,items[0].createdAt);const max=items.reduce((m,t)=>t.endDate>m?t.endDate:m,items[0].endDate);const days=Math.max(daysBetween(min,max),1)+1;const dw=38;const ticks=Array.from({length:days},(_,i)=>'<div class="tick">'+addDays(min,i).slice(5)+'</div>').join("");return '<div class="gantt"><div class="gantt-grid"><div class="gantt-header"><div>Milestone / Task</div><div class="timeline" style="grid-template-columns:repeat('+days+','+dw+'px)">'+ticks+'</div></div>'+items.map(it=>{const parent=getItems(w).find(x=>x.id===getParentMilestoneId(w,it));const left=daysBetween(min,it.createdAt)*dw;const width=Math.max(Number(it.duration),1)*dw;return '<div class="gantt-row"><div class="gantt-label"><strong>'+(it.type==="task"&&parent?"↳ ":"")+'#'+it.number+' '+esc(it.name)+'</strong><br>'+it.type+(parent?' · parent: '+esc(parent.name):"")+'<br>'+esc(it.owner)+' · '+it.createdAt+' → '+it.endDate+'<br><span class="badge" style="background:'+(data.statusColors[it.status]||"#e5e7eb")+';color:#111827">'+esc(it.status)+'</span><div class="small">Depends on: '+deps(w,it).replaceAll("<br>",", ")+'</div></div><div class="bar-area" style="width:'+(days*dw)+'px"><div class="bar '+(it.type==="milestone"?"milestone":"")+'" style="left:'+left+'px;width:'+width+'px">'+esc(it.name)+'</div></div></div>'}).join("")+'</div></div>'}

function globalTable(items){if(!items.length)return '<div class="empty">No items match the selected filters.</div>';let rows="";data.workstreams.forEach(w=>{const group=items.filter(it=>it.workstreamId===w.id);if(!group.length)return;rows+='<tr class="global-workstream-row"><td colspan="10">Workstream: '+esc(w.name)+'</td></tr>';getMilestones(w).forEach(m=>{const showM=group.some(it=>it.id===m.id)||group.some(it=>it.type==="task"&&getParentMilestoneId(w,it)===m.id);if(!showM)return;rows+=globalRow(w,m,null);group.filter(it=>it.type==="task"&&getParentMilestoneId(w,it)===m.id).forEach(t=>rows+=globalRow(w,t,m))});const orphans=group.filter(it=>it.type==="task"&&!getParentMilestoneId(w,it));if(orphans.length){rows+='<tr class="milestone-row"><td>'+esc(w.name)+'</td><td>-</td><td><span class="type-pill milestone">milestone</span></td><td><strong>Unassigned tasks</strong></td><td>Tasks without milestone</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td><td>-</td></tr>';orphans.forEach(t=>rows+=globalRow(w,t,null))}});return '<div class="table-wrap"><table><thead><tr><th>Workstream</th><th>ID</th><th>Type</th><th>Name</th><th>Description</th><th>Start</th><th>Duration</th><th>End</th><th>Status</th><th>Owner</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}

function exportJSON(){const now=new Date();const hh=String(now.getHours()).padStart(2,"0");const mm=String(now.getMinutes()).padStart(2,"0");download("aava-scib-program-"+todayISO()+"-"+hh+mm+".json",JSON.stringify(data,null,2),"application/json")}
function importJSON(e){const f=e.target.files[0];if(!f)return;if(!confirm("Importing will overwrite all data. Continue?"))return;const r=new FileReader();r.onload=ev=>{try{data=normalize(JSON.parse(ev.target.result));activeId="global";persist();render()}catch{alert("Invalid JSON file.")}};r.readAsText(f);e.target.value=""}
function exportWorkstreamJSON(){const w=getWorkstream();const now=new Date();const hh=String(now.getHours()).padStart(2,"0");const mm=String(now.getMinutes()).padStart(2,"0");const safe=w.name.replace(/[^a-z0-9]+/gi,"-").toLowerCase();download("aava-scib-"+safe+"-"+todayISO()+"-"+hh+mm+".json",JSON.stringify({type:"workstream",sourceWorkstreamId:w.id,sourceWorkstreamName:w.name,workstream:{id:w.id,name:w.name,items:w.items}},null,2),"application/json")}
function importWorkstreamJSON(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const obj=JSON.parse(ev.target.result);if(obj.type!=="workstream")throw new Error();const idx=data.workstreams.findIndex(w=>w.id===obj.sourceWorkstreamId);if(idx<0)return alert("Target workstream not found.");if(!confirm("This will replace workstream "+data.workstreams[idx].name+". Continue?"))return;data.workstreams[idx]=normalize({owners:data.owners,statuses:data.statuses,statusColors:data.statusColors,workstreams:[{...data.workstreams[idx],items:obj.workstream.items||[]}]}).workstreams[0];activeId=data.workstreams[idx].id;persist();render()}catch{alert("Invalid workstream JSON.")}};r.readAsText(f);e.target.value=""}
function exportExcel(){const sheets=data.workstreams.map(w=>'<Worksheet ss:Name="'+esc(w.name).slice(0,31)+'"><Table><Row>'+["ID","Type","Name","Description","Start","Duration","End","Status","Owner","Dependencies"].map(h=>'<Cell><Data ss:Type="String">'+h+'</Data></Cell>').join("")+'</Row>'+orderedItems(w).map(it=>{const p=getItems(w).find(x=>x.id===getParentMilestoneId(w,it));return '<Row><Cell><Data ss:Type="String">#'+it.number+'</Data></Cell><Cell><Data ss:Type="String">'+it.type+'</Data></Cell><Cell><Data ss:Type="String">'+esc(it.name)+'</Data></Cell><Cell><Data ss:Type="String">'+esc(it.description)+'</Data></Cell><Cell><Data ss:Type="String">'+it.createdAt+'</Data></Cell><Cell><Data ss:Type="Number">'+it.duration+'</Data></Cell><Cell><Data ss:Type="String">'+it.endDate+'</Data></Cell><Cell><Data ss:Type="String">'+esc(it.status)+'</Data></Cell><Cell><Data ss:Type="String">'+esc(it.owner)+'</Data></Cell><Cell><Data ss:Type="String">'+deps(w,it).replaceAll("<br>",", ")+'</Data></Cell></Row>'}).join("")+'</Table></Worksheet>').join("");download("aava-scib-backlog-"+todayISO()+".xls",'<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+sheets+'</Workbook>',"application/vnd.ms-excel")}
function download(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}

function toggleMaximize(id){const el=document.getElementById(id);if(!el)return;let b=document.getElementById("maximizeBackdrop");if(!b){b=document.createElement("div");b.id="maximizeBackdrop";b.className="maximize-backdrop";b.onclick=closeMaximize;document.body.appendChild(b)}if(el.classList.contains("maximized-card")){closeMaximize();return}closeMaximize();el.classList.add("maximized-card");b.style.display="block"}
function closeMaximize(){document.querySelectorAll(".maximized-card").forEach(el=>el.classList.remove("maximized-card"));const b=document.getElementById("maximizeBackdrop");if(b)b.style.display="none"}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMaximize()});

render();
loadFromBlob();
</script>
